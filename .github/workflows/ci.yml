# Repo CI for claude-pipeline itself. The two check names "test (ubuntu)" and "test (windows)" are this repo's required
# checks (.claude/pipeline.yml ci.required_checks): renaming either breaks branch protection. Both are AGGREGATE jobs:
#   "test (ubuntu)"  the suite runs once per Node version, each in two shards in parallel ("test (ubuntu node 20 1/2)" ..
#                    "test (ubuntu node 24 2/2)", not required on their own); the aggregate goes green only when all four
#                    succeeded. (One serial job ran the suite twice, ~23 min each on a slow runner, and the 45-minute limit cut
#                    it short with every test passing.)
#   "test (windows)" the suite runs in seven shards ("test (windows 1/7)" .. "7/7", not required on their own); the aggregate
#                    goes green only when every shard succeeded.
# On a non-draft event a failed, cancelled or skipped Node job or shard makes its aggregate red, never green or skipped, so a
# required check can never be satisfied by a job that did not run.
#
# Draft PRs are skipped (ci.draft_while_iterating: true in .claude/pipeline.yml; `pipeline redraft` turns a ready PR back to
# draft before each review-fix push): both required checks read "skipped" on a draft, the suite runs once when the PR is marked
# ready (`ready_for_review`) and on every push after that. `converted_to_draft` is a listed trigger: it joins the PR's
# concurrency group (below), so redrafting cancels a suite that is still running, and its own run skips because the PR is a draft
# by then. Each aggregate skips on exactly the same condition as its jobs, never on anything else. Push to main is unchanged.
#
# Merge queue: the repo's default branch can use GitHub's merge queue, which builds a temporary commit (head + the queued PRs
# ahead) on a gh-readonly-queue/... branch and waits for the required checks on it. `merge_group` (types: checks_requested) is the
# trigger that runs this workflow there, so "test (ubuntu)" and "test (windows)" report on the queue commit. A merge_group event has
# no pull_request payload, so every `github.event_name != 'pull_request' || ...` condition below is true for it: nothing is skipped
# as a draft, the aggregates report success or failure (never skipped), and the tested-tree step (push only) does not run. Its
# concurrency group is its own queue ref, which no other run shares, and only pull_request runs ever cancel.
# The suite runs in full on the queue commit unless a job PROVES it already passed: each matrix job's "Already tested on the PR run?"
# step (.github/scripts/queue-reuse.mjs, run from the BASE commit's copy, never the PR's own) answers run=false only when the queue
# holds exactly this one PR, the diff over the base touches no workflow, test runner or proof code (PROOF_LOGIC in
# queue-reuse.mjs: .github/**, the test runner and every pipeline module it or the decider imports, package files, .gitattributes), the newest pull_request run of
# this workflow on the PR head (latest attempt, green) tested a merge commit (referenced_workflows: refs/pull/N/merge) whose tree
# equals the queue commit's tree, and that attempt's same-named job and its test step (and the installer round trip on its
# designated shard) succeeded. The job then still starts and reports success with its test steps skipped, so the aggregates are
# unchanged. A batch, a moved merge ref (main advanced), a changed workflow, any API or git error: the suite runs. The first queue run
# after this reuse lands has no decider in its base and runs in full.
#
# Every step runs under bash (Git Bash on Windows) so one script serves both runners. The
# installer runs into a throwaway Claude home whose path contains a space, then --check must
# report no drift, a second install must be a no-op, and --uninstall must leave no pipeline files.
#
# Push to main skips a job's steps when that code already passed the SAME job (.github/scripts/tested-tree.mjs), on either of
# two pieces of evidence, the first tried before the second:
#   1. merge queue: a successful merge_group run of this workflow (from this repo) on the very commit that was pushed has this
#      job green. The queue fast-forwards main to the exact commit its merge_group run tested (for a batch, the top queue
#      commit, whose run tested everything below it), so the same sha means the same tree.
#   2. merged PR: identical tree (git tree sha of the pushed commit == tree of the PR head), the PR head contains the previous
#      main (so the PR run's merge checkout was that same tree), and a completed pull_request run of this workflow on that head
#      has this job green.
# Either makes the main run redundant, so a merge costs no second long run. If neither proves it (for instance the PR branch
# was NOT up to date at a direct merge, so the trees differ), the job runs: that is the intended fail-open. Any API or git
# error also means run. The job itself still starts and reports success (skipped steps), so the required check names are
# unchanged. pull_request runs never skip; a merge_group run skips only on the proof above.
name: CI

on:
  pull_request:
    # The default types (opened, synchronize, reopened) plus the two the draft flow needs.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  # GitHub's merge queue asks for the required checks on its temporary commit with this event; without it the queue never gets a result.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # actions + pull-requests: read-only, for the tested-tree and queue-reuse skip steps (find the merged / queued PR and its passed CI jobs).
  actions: read
  pull-requests: read

concurrency:
  # On merge_group, github.ref is the queue's temporary branch (refs/heads/gh-readonly-queue/main/pr-<N>-<sha>): one group per queue entry,
  # so one entry's run never cancels or waits behind another's. Only a pull_request run is cancelled when superseded.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The suite runs once per Node version, in two shards each, all in parallel: 20 is the oldest line the pipeline supports, 24 the
  # current LTS. A whole run is ~12-23 min on a slow runner; run serially in one job they hit the 45-minute limit on 2026-11-12
  # (PR #308) with every test green. node scripts/test.mjs --shard I/2 gives each job half of the test files, balanced by measured time.
  test-ubuntu-node:
    name: test (ubuntu node ${{ matrix.node }} ${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Let the other Node version finish so one run shows every failure; the aggregate below still goes red.
      fail-fast: false
      matrix:
        node: [20, 24]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # merge_group: the queue commit and its first parent (the base), so the reuse step reads the base locally, no fetch.
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 1 }}

      # Push to main only: skip this job when this exact commit passed it in the merge queue, or the exact tree passed it on the merged PR.
      - name: Already tested on the PR?
        id: tested
        if: github.event_name == 'push'
        continue-on-error: true
        run: node .github/scripts/tested-tree.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          JOB_NAME: test (ubuntu node ${{ matrix.node }} ${{ matrix.shard }}/2)

      # Merge queue only: skip the test steps when a pull_request run of this same job already passed on a byte-identical tree
      # (.github/scripts/queue-reuse.mjs). The decision runs the BASE commit's copy of that script (never the PR's own, which the queue
      # commit contains), extracted into $RUNNER_TEMP/base. A base without it, or any error, answers run.
      - name: Already tested on the PR run?
        id: reused
        if: github.event_name == 'merge_group'
        continue-on-error: true
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          set -o pipefail
          if [ "$(git rev-parse -q --verify 'HEAD^1' 2>/dev/null)" != "$BASE_SHA" ]; then
            echo "RUN: merge_group base $BASE_SHA is not the first parent of the queue commit (or the checkout lacks it)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git archive "$BASE_SHA" .github/scripts pipeline/lib | (cd "$base" && tar -x) && [ -f "$base/.github/scripts/queue-reuse.mjs" ]; then
            node "$base/.github/scripts/queue-reuse.mjs"
          else
            echo "RUN: base $BASE_SHA has no queue-reuse decider (or it could not be read)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          JOB_NAME: test (ubuntu node ${{ matrix.node }} ${{ matrix.shard }}/2)
          TEST_STEP: Tests (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/2)
          SHARD: ${{ matrix.shard }}
          INSTALLER_STEP: Installer round trip (Node ${{ matrix.node }})
          INSTALLER_SHARD: '2'

      - name: Node ${{ matrix.node }}
        if: (github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # The Ubuntu jobs record and print per-file times and the manifest too, so a run can be measured; scripts/shard-weights.mjs reads
      # only the Windows shards for test-weights.json.
      - name: Tests (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/2)
        if: (github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false')
        run: node scripts/test.mjs --shard ${{ matrix.shard }}/2
        env:
          CP_TEST_TIMES: ${{ runner.temp }}/cp-file-times.json
      - name: File times (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/2)
        if: always() && ((github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false'))
        env:
          CP_TEST_TIMES: ${{ runner.temp }}/cp-file-times.json
        run: |
          echo CP-FILE-TIMES-BEGIN
          cat "$CP_TEST_TIMES" || true
          echo
          echo CP-FILE-TIMES-END
          echo CP-FILE-MANIFEST-BEGIN
          cat "$CP_TEST_TIMES.manifest" || true
          echo
          echo CP-FILE-MANIFEST-END
      # The installer round trip is one script, not a shard of the suite: it runs once per Node version, in shard 2.
      - name: Installer round trip (Node ${{ matrix.node }})
        if: matrix.shard == 2 && ((github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false'))
        run: ./.github/scripts/installer-round-trip.sh "$RUNNER_TEMP/claude home ${{ matrix.node }}"

  # The required check. always() makes it run (and report) even when a Node job failed or was cancelled; it is green only
  # when the Node jobs' overall result is exactly "success" (a skipped or cancelled matrix would otherwise leave the
  # check missing or neutral). Do not add steps that can succeed independently of that result. On a draft PR the Node jobs are
  # skipped by design, so this skips too (same condition); on every other event it is still always().
  test-ubuntu:
    name: test (ubuntu)
    needs: test-ubuntu-node
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Ubuntu Node job passed
        env:
          NODES_RESULT: ${{ needs.test-ubuntu-node.result }}
        run: |
          echo "test-ubuntu-node result: $NODES_RESULT"
          [ "$NODES_RESULT" = "success" ] || exit 1

  # Never runs (if: false). Referencing a reusable workflow is what makes GitHub record the commit this run tested
  # (referenced_workflows: refs/pull/<N>/merge + sha), which the final gate's CI proof for `tests` requires
  # (.claude/pipeline.yml verify.ci_proof, pipeline/lib/ci-proof.mjs). Remove it and every proof is "missing".
  proof-anchor:
    if: ${{ false }}
    permissions: {}
    uses: ./.github/workflows/proof-anchor.yml

  # The Windows suite is slow (~30-40 min as one job), so it runs as seven shards in parallel: node scripts/test.mjs
  # --shard I/7 gives each runner a seventh of the test files balanced by measured time (scripts/lib/test-weights.json, refreshed
  # with scripts/shard-weights.mjs from the file times printed below; files not measured yet are balanced by size).
  # One Node version on Windows: Node 24, the current LTS line and what the actions themselves run on. Node 20 stays covered
  # on ubuntu (test-ubuntu-node).
  test-windows-shard:
    name: test (windows ${{ matrix.shard }}/7)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      # Let the other shards finish so one run shows every failure; the aggregate below still goes red.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      # Keep LF endings: .gitattributes pins *.mjs/*.sh to LF and fixtures to -text, and the
      # byte-exact fixture tests (diffs, .cmd quoting) depend on that.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # merge_group: the queue commit and its first parent (the base), so the reuse step reads the base locally, no fetch.
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 1 }}

      # Push to main only: skip this job when this exact commit passed it in the merge queue, or the exact tree passed it on the merged PR.
      - name: Already tested on the PR?
        id: tested
        if: github.event_name == 'push'
        continue-on-error: true
        run: node .github/scripts/tested-tree.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          JOB_NAME: test (windows ${{ matrix.shard }}/7)

      # Merge queue only: skip the test steps when a pull_request run of this same job already passed on a byte-identical tree
      # (.github/scripts/queue-reuse.mjs). The decision runs the BASE commit's copy of that script (never the PR's own, which the queue
      # commit contains), extracted into $RUNNER_TEMP/base. A base without it, or any error, answers run.
      - name: Already tested on the PR run?
        id: reused
        if: github.event_name == 'merge_group'
        continue-on-error: true
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          set -o pipefail
          if [ "$(git rev-parse -q --verify 'HEAD^1' 2>/dev/null)" != "$BASE_SHA" ]; then
            echo "RUN: merge_group base $BASE_SHA is not the first parent of the queue commit (or the checkout lacks it)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git archive "$BASE_SHA" .github/scripts pipeline/lib | (cd "$base" && tar -x) && [ -f "$base/.github/scripts/queue-reuse.mjs" ]; then
            node "$base/.github/scripts/queue-reuse.mjs"
          else
            echo "RUN: base $BASE_SHA has no queue-reuse decider (or it could not be read)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          JOB_NAME: test (windows ${{ matrix.shard }}/7)
          TEST_STEP: Tests (Node 24, shard ${{ matrix.shard }}/7)
          SHARD: ${{ matrix.shard }}
          INSTALLER_STEP: Installer round trip (Node 24)
          INSTALLER_SHARD: '7'

      - name: Node 24
        if: (github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tests (Node 24, shard ${{ matrix.shard }}/7)
        if: (github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false')
        run: node scripts/test.mjs --shard ${{ matrix.shard }}/7
        env:
          CP_TEST_TIMES: ${{ runner.temp }}/cp-file-times.json
      # Per-file wall-clock times of this shard, and the manifest of the files it was given (shard label, its file list, size and hash of
      # the full list), each between marker lines, for scripts/shard-weights.mjs to read from the job log.
      - name: File times (shard ${{ matrix.shard }}/7)
        if: always() && ((github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false'))
        env:
          CP_TEST_TIMES: ${{ runner.temp }}/cp-file-times.json
        run: |
          echo CP-FILE-TIMES-BEGIN
          cat "$CP_TEST_TIMES" || true
          echo
          echo CP-FILE-TIMES-END
          echo CP-FILE-MANIFEST-BEGIN
          cat "$CP_TEST_TIMES.manifest" || true
          echo
          echo CP-FILE-MANIFEST-END
      # The installer round trip is one script, not a shard of the suite: it runs once, in shard 7.
      - name: Installer round trip (Node 24)
        if: matrix.shard == 7 && ((github.event_name != 'push' || steps.tested.outputs.run != 'false') && (github.event_name != 'merge_group' || steps.reused.outputs.run != 'false'))
        run: ./.github/scripts/installer-round-trip.sh "$RUNNER_TEMP/claude home 24"

  # The required check. always() makes it run (and report) even when a shard failed or was cancelled; it is green only
  # when the shard job's overall result is exactly "success" (a skipped or cancelled matrix would otherwise leave the
  # check missing or neutral). Do not add steps that can succeed independently of that result. On a draft PR the shards are
  # skipped by design, so this skips too (same condition); on every other event it is still always().
  test-windows:
    name: test (windows)
    needs: test-windows-shard
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows shard passed
        env:
          SHARDS_RESULT: ${{ needs.test-windows-shard.result }}
        run: |
          echo "test-windows-shard result: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = "success" ] || exit 1
